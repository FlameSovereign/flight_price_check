# 监控清单 —— 改这里就能改要盯的航线、日期和舱位。
# Watchlist: edit this file to change what gets tracked.

[search]
cabin = "business"          # economy | premium-economy | business | first
# 要比较的买法，可以同时写几种：
# one-way       只查去程单程
# round-trip    一张往返票（目前在售的打折商务舱往返票大多最长只能停留约 1 个月；
#               更长停留的便宜往返票往往要等航司放出夏季运价）
# two-one-ways  去程单程 + 回程单程分开买，两段各自给买/等建议
trip = ["round-trip", "two-one-ways"]
return_after_days = 45      # 只在没有设 [dates] outbound/return 时用：回程 = 出发 + N 天
adults = 1
currency = "USD"
request_delay_seconds = 1.0 # pause between Google requests; be polite

[dates]
# 你的行程：5 月回国、8 月回美国。设了 outbound / return，就只扫这两个窗口：
# 每个去程日期都和每个回程日期配对查往返票，两个窗口的日期也各自查单程。
# 便宜的舱位按天开关（实测 5/15 比前后两天便宜 $500），所以单程扫得密一些。
outbound = { from = "2027-05-01", to = "2027-05-31", step_days = 2 }
return = { from = "2027-08-01", to = "2027-08-25", step_days = 3 }
round_trip_every = 2   # 往返票只用每隔一个日期配对（去程每 4 天 × 回程每 6 天），控制搜索量

# 没设 outbound / return 时，改用滚动网格：
# 扫描未来 start_days..end_days 天内的出发日，每 step_days 天一个。
# 日期锚定在固定日历上，所以每天跑的是同一批出发日，价格曲线能连起来。
# step_days 不是 7 的倍数，出发日会轮流落在一周的不同天。
start_days = 10
end_days = 270
step_days = 6

# 重点窗口：窗口内每天都扫（例如春节前后）。
windows = [
  # { from = "2027-01-28", to = "2027-02-08" },
]

# 目的地：一个“城市”可以包含多个机场，一次搜索全覆盖（Google 一次最多接受约 10 个机场）。
# china = 全国 10 个主要机场，回答“落地哪里都行，最便宜是多少”；但多城市搜索 Google 不给 60 天价格历史，
# 所以上海、北京单独再查一次，给预测模型提供历史数据。
[destinations]
china = ["PVG", "SHA", "PEK", "PKX", "CAN", "SZX", "HGH", "CTU", "TFU", "XMN"]
shanghai = ["PVG", "SHA"]
beijing = ["PEK", "PKX"]
# guangzhou = ["CAN"]
# shenzhen = ["SZX"]
# chengdu = ["TFU", "CTU"]

# 策略：每个策略 × 每个目的地 × 每个出发日 = 一次搜索。
# origin      出发机场
# airlines    只看这些航司（Google 仍会返回 60 天价格历史）
# connecting  只允许在这些机场转机（Google 不再返回价格历史，只有当天价格）
# via         结果里必须经过这些机场之一（本地过滤）
# position_from  另查一张从这里到 origin 的经济舱单程，计入总价（分开出票）
# position_days_before  定位航段提前几天飞（默认 1：前一天飞到，分开出票别赶同一天的衔接；不含酒店）

[[strategy]]
key = "atl-any"
name = "ATL 直接出发 · 任意航司"
origin = ["ATL"]

[[strategy]]
key = "atl-tk"
name = "ATL → 伊斯坦布尔转机 · 土耳其航空"
origin = ["ATL"]
airlines = ["TK"]

[[strategy]]
key = "atl-japan"
name = "ATL 出发 · 经东京转机（一张票）"
origin = ["ATL"]
connecting = ["IAH", "ORD", "DFW", "LAX", "SFO", "SEA", "JFK", "YYZ", "YVR", "NRT", "HND"]
via = ["NRT", "HND"]

[[strategy]]
key = "iah-ana"
name = "先飞休斯顿 · IAH 出发全日空"
origin = ["IAH"]
airlines = ["NH"]
position_from = ["ATL"]

[model]
horizon_days = 14     # 预测"未来 N 天内会不会更便宜"
drop_threshold = 0.03 # 至少便宜 3% 才算"值得等"
wait_above = 0.55     # 模型：P(降价) 高于这个 → 等，否则买
min_days_out = 21     # 离出发不到这么多天就不建议再等
rule_margin = 0.05    # 规则：比 28 天最低价贵这么多 → 便宜的舱位最近开过，可能再开，等

[alerts]
# 价格（含定位航段）低于这些值时，GitHub Actions 会开一个 issue 提醒你。
round_trip = 5000   # 一张往返票（你通常 2/3 月能买到的价位）
one_way = 2800      # 单程（去程或回程）
