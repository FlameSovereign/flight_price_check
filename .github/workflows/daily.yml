name: Daily price check

on:
  schedule:
    - cron: "23 11 * * *" # 07:23 in Atlanta (EDT), 06:23 in winter
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen

      - name: Collect prices and write report
        run: uv run flightcheck run

      - name: Commit data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: prices for $(date -u +%F)"
          git pull --rebase
          git push

      - name: Open an issue for price alerts
        if: hashFiles('reports/alerts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "机票价格提醒 $(date -u +%F)" --body-file reports/alerts.md
