[project]
name = "flightcheck"
version = "0.1.0"
description = "Track Google Flights business-class prices and predict whether to buy now or wait."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "threadpoolctl>=3",
]

[project.scripts]
flightcheck = "flightcheck.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
